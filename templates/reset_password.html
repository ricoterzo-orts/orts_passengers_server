<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/static/favicon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reimposta Password — ViaggiaTreno Virtual</title>
<style>
@font-face {
  font-family: 'Futura';
  src: url('/static/futur.woff2') format('woff2'),
       url('/static/futur.ttf') format('truetype');
  font-weight: normal;
}
@font-face {
  font-family: 'Futura';
  src: url('/static/futura_medium_bt.woff2') format('woff2'),
       url('/static/futura_medium_bt.ttf') format('truetype');
  font-weight: 500;
}
:root {
  --accent:  #CE1B26;
  --accent2: #A8141D;
  --green:   #007A3D;
  --font:    'Futura','Trebuchet MS',sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body, html { height: 100%; font-family: var(--font); }
body { display: flex; flex-direction: column; min-height: 100vh; }

.bg {
  background-image: url('/static/train-bg.jpg');
  background-size: cover;
  background-position: center;
  position: fixed; inset: 0; z-index: -1;
  filter: brightness(0.45);
}

.container {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}

.box {
  background: #fff;
  padding: 36px 32px;
  border-radius: 4px;
  width: 100%; max-width: 380px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.logo { max-width: 160px; margin-bottom: 20px; }

h2 {
  font-size: 13px; font-weight: 500;
  letter-spacing: .12em; text-transform: uppercase;
  color: #444; margin-bottom: 22px;
}

.field { text-align: left; margin-bottom: 12px; }
.field label {
  display: block; font-size: 9px; font-weight: 500;
  color: #888; margin-bottom: 4px;
  letter-spacing: .12em; text-transform: uppercase;
}
.required-mark { color: var(--accent); }
.field input {
  width: 100%; padding: 10px 12px;
  border: 1px solid #ddd; border-radius: 2px;
  font-family: var(--font); font-size: 13px;
  outline: none; transition: border-color .15s;
  background: #fff; color: inherit;
}
.field input:focus { border-color: var(--accent); }

.btn {
  width: 100%; padding: 12px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 2px;
  font-family: var(--font); font-size: 12px;
  font-weight: 500; letter-spacing: .1em;
  text-transform: uppercase; cursor: pointer;
  transition: background .15s;
}
.btn:hover { background: var(--accent2); }
.btn:disabled { background: #ccc; cursor: not-allowed; }

.msg {
  margin-top: 12px; font-size: 12px; min-height: 18px;
  font-family: var(--font);
}
.msg.err { color: var(--accent); }
.msg.ok  { color: var(--green); }

.invalid-box {
  text-align: center; padding: 8px 0;
  font-size: 13px; color: #666; line-height: 1.8;
}
.invalid-box .icon { font-size: 36px; margin-bottom: 12px; }
.invalid-box a {
  color: var(--accent); text-decoration: none; font-weight: 500;
}
.invalid-box a:hover { text-decoration: underline; }

.password-hint {
  font-size: 10px; color: #aaa; text-align: left;
  margin-top: -6px; margin-bottom: 10px; letter-spacing: .03em;
}

footer{position:relative;z-index:1;text-align:center;padding:18px 20px;font-family:var(--font);font-size:10px;color:#ddd;letter-spacing:.06em;border-top:2px solid var(--accent)}
footer span{color:var(--accent);font-weight:500}
</style>
</head>
<body>

<div class="bg"></div>

<div class="container">
  <div class="box">
    <img src="/static/VTV_logo.jpg" alt="ViaggiaTreno Virtual" class="logo">
    <h2>Reimposta Password</h2>

    {% if valid %}
    <!-- Token valido: mostra il form -->
    <div id="form-wrap">
      <div class="field">
        <label>Nuova password <span class="required-mark">*</span></label>
        <input type="password" id="new-pass" placeholder="••••••••" autocomplete="new-password">
      </div>
      <p class="password-hint">Minimo 6 caratteri</p>
      <div class="field">
        <label>Conferma password <span class="required-mark">*</span></label>
        <input type="password" id="conf-pass" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn" id="reset-btn" onclick="doReset()">Salva nuova password</button>
      <div class="msg" id="reset-msg"></div>
    </div>
    {% else %}
    <!-- Token non valido o scaduto -->
    <div class="invalid-box">
      <div class="icon">⚠️</div>
      <p>Il link di recupero non è valido o è scaduto.<br>
      I link hanno una validità di <strong>2 ore</strong>.</p>
      <br>
      <a href="/login">← Torna al login</a> e richiedi un nuovo link.
    </div>
    {% endif %}
  </div>
</div>

<footer>
  <span>ViaggiaTreno Virtual</span> &mdash; by TSH Studio Repaint &copy; <span id="footer-year"></span>
</footer>
<script>document.getElementById('footer-year').textContent=new Date().getFullYear();</script>

{% if valid %}
<script>
const RESET_TOKEN = {{ token | tojson }};

document.addEventListener('keypress', e => { if(e.key==='Enter') doReset(); });

async function doReset() {
  const btn  = document.getElementById('reset-btn');
  const msg  = document.getElementById('reset-msg');
  const pass = document.getElementById('new-pass').value;
  const conf = document.getElementById('conf-pass').value;

  if(!pass || !conf) {
    msg.textContent = '✗ Compila entrambi i campi'; msg.className = 'msg err'; return;
  }
  if(pass.length < 6) {
    msg.textContent = '✗ La password deve essere di almeno 6 caratteri'; msg.className = 'msg err'; return;
  }
  if(pass !== conf) {
    msg.textContent = '✗ Le password non coincidono'; msg.className = 'msg err'; return;
  }

  btn.disabled = true; msg.textContent = 'Salvataggio...'; msg.className = 'msg';
  try {
    const r = await fetch('/api/password_reset_confirm', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: RESET_TOKEN, password: pass})
    });
    const d = await r.json();
    if(d.ok) {
      msg.textContent = '✓ ' + d.message; msg.className = 'msg ok';
      document.getElementById('form-wrap').style.opacity = '0.4';
      document.getElementById('form-wrap').style.pointerEvents = 'none';
      setTimeout(() => window.location.href = '/login', 2200);
    } else {
      msg.textContent = '✗ ' + d.error; msg.className = 'msg err';
      btn.disabled = false;
    }
  } catch(e) {
    msg.textContent = '✗ Errore di connessione. Riprova.'; msg.className = 'msg err';
    btn.disabled = false;
  }
}
</script>
{% endif %}

</body>
</html>
